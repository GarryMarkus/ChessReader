id: "neo-yellow"
name: "Neo Yellow"
author: "Garry Markus"
version: "1.0.0"
description: "Vibrant Neo piece set paired with warm yellow tournament board."

board:
  type: "backdrop"
  backdrop_image: "../assets/boards/yellow.png"
  light_square: "#fbfae9"
  dark_square: "#cea861"
  border_color: "#23272e"
  coordinates:
    show: true
    placement: "inside"
    font_family: "JetBrains Mono"
    font_size: 11
    light_color: "#8a7042"
    dark_color: "#a4854b"
  highlights:
    selected_square: "rgba(97, 175, 239, 0.40)"
    last_move: "rgba(229, 192, 123, 0.30)"
    legal_move_dot: "rgba(100, 100, 110, 0.55)"
    check: "rgba(224, 108, 117, 0.70)"
    hover: "rgba(255, 255, 255, 0.08)"
  drawings:
    arrow_primary: "rgba(40, 180, 100, 0.85)"
    arrow_secondary: "rgba(240, 160, 20, 0.85)"
    arrow_tactical: "rgba(220, 50, 50, 0.85)"
    arrow_alternate: "rgba(80, 140, 240, 0.85)"

pieces:
  wP: "../assets/pieces/neo/wP.png"
  wN: "../assets/pieces/neo/wN.png"
  wB: "../assets/pieces/neo/wB.png"
  wR: "../assets/pieces/neo/wR.png"
  wQ: "../assets/pieces/neo/wQ.png"
  wK: "../assets/pieces/neo/wK.png"
  bP: "../assets/pieces/neo/bP.png"
  bN: "../assets/pieces/neo/bN.png"
  bB: "../assets/pieces/neo/bB.png"
  bR: "../assets/pieces/neo/bR.png"
  bQ: "../assets/pieces/neo/bQ.png"
  bK: "../assets/pieces/neo/bK.png"
